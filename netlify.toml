# ============================================================
# FashionToWorld — Netlify configuration
# ============================================================
[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/sitemap.xml"
  to = "https://api.fashiontoworld.co/api/sitemap.xml"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Long-cache genuinely static assets (images, fonts) for CDN speed
[[headers]]
  for = "/public/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# BUT always revalidate CSS/JS so edits reach every visitor on next load
[[headers]]
  for = "/public/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/public/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
