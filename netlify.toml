# ============================================================
# FashionToWorld — Netlify configuration
# ============================================================
[build]
  publish = "."
  functions = "netlify/functions"
  # Bake top products into category pages' HTML at build time (SEO + fast paint).
  # prerender.js is fail-safe: on any API error it leaves pages client-rendered,
  # so this can never fail the deploy. Re-runs each build from the committed
  # (placeholder) pages, so content stays fresh via scheduled rebuilds.
  command = "node prerender.js"

[[redirects]]
  from = "/sitemap.xml"
  to = "https://api.fashiontoworld.co/api/sitemap.xml"
  status = 200
  force = true

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Long-cache genuinely static assets (images, fonts) for CDN speed
[[headers]]
  for = "/public/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# BUT always revalidate CSS/JS so edits reach every visitor on next load
[[headers]]
  for = "/public/css/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/public/js/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
